name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Тесты и сборка работают на изолированной файловой БД.
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-secret-2f8c1d94ab7e5306f1ac
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Автотесты
        run: npm test

      - name: Прод-сборка
        run: npm run build

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: duoduo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
