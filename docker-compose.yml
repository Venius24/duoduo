services:
  duoduo:
    build: .
    image: duoduo:latest
    container_name: duoduo
    ports:
      - '${PORT:-3000}:3000'
    environment:
      # SQLite на постоянном томе. Для PostgreSQL достаточно подставить сюда
      # postgres://... — провайдер схемы переключится автоматически.
      DATABASE_URL: '${DATABASE_URL:-file:/app/data/duoduo.db}'
      # Обязательная переменная: без неё контейнер осознанно не стартует.
      # Значение задаётся в .env рядом с этим файлом (см. .env.example).
      JWT_SECRET: '${JWT_SECRET:?задай JWT_SECRET — сгенерируй командой npm run gen:secret}'
      # За TLS-терминирующим прокси приложение видит http, поэтому флаг
      # Secure на cookie нужно включить вручную.
      COOKIE_SECURE: '${COOKIE_SECURE:-0}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      AI_BASE_URL: '${AI_BASE_URL:-https://api.openai.com/v1}'
      AI_MODEL: '${AI_MODEL:-gpt-4o-mini}'
      APP_VERSION: '${APP_VERSION:-1.0.0}'
    volumes:
      - duoduo-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

volumes:
  duoduo-data:
